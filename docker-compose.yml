version: "3.9"

# ============================================================
# PRISM-EDU — Local Development Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f api    # Follow API logs
#   docker-compose down -v        # Stop and remove volumes
# ============================================================

networks:
  prism-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism_edu
      POSTGRES_USER: prism_user
      POSTGRES_PASSWORD: prism_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    ports:
      - "5432:5432"
    networks:
      - prism-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism_user -d prism_edu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: prism-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - prism-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Object Storage ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: prism-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - prism-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MailHog (Local Email Testing) ────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: prism-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - prism-network

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: prism-api
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+asyncpg://prism_user:prism_dev_password@postgres:5432/prism_edu
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    ports:
      - "8000:8000"
    networks:
      - prism-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: prism-worker
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+asyncpg://prism_user:prism_dev_password@postgres:5432/prism_edu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    networks:
      - prism-network
    depends_on:
      - api
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ── Next.js Frontend ──────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: prism-web
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    volumes:
      - ./apps/web:/app
      - ./packages:/packages
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - prism-network
    depends_on:
      - api
    command: npm run dev
