name: PRISM-EDU CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Backend: Lint, Type Check, Unit Tests ───────────────────
  api-quality:
    name: API Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app/ --strict

      - name: Security scan (bandit)
        run: bandit -r app/ -ll

      - name: Unit tests
        run: |
          pytest tests/unit/ -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=80
        env:
          APP_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend-unit

  # ── Backend: Integration Tests ───────────────────────────────
  api-integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: api-quality

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: prism_edu_test
          POSTGRES_USER: prism_test_user
          POSTGRES_PASSWORD: prism_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://prism_test_user:prism_test_password@localhost:5432/prism_edu_test

      - name: Integration tests
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            --cov=app \
            --cov-report=xml
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://prism_test_user:prism_test_password@localhost:5432/prism_edu_test
          REDIS_URL: redis://localhost:6379/0
          JWT_ALGORITHM: RS256

  # ── Frontend: Lint, Type Check, Build ───────────────────────
  web-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Unit tests (Jest)
        run: npm run test -- --coverage --ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: test

  # ── Security Tests ───────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api-quality, web-quality]

    steps:
      - uses: actions/checkout@v4

      - name: Python security scan (bandit)
        run: |
          pip install bandit
          bandit -r apps/api/app/ -f json -o bandit-report.json || true

      - name: npm audit (frontend)
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: npm audit (packages)
        run: |
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir" && npm audit --audit-level=high && cd -
            fi
          done

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ── E2E Tests ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [api-integration, web-quality]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: prism_edu_e2e
          POSTGRES_USER: prism_e2e_user
          POSTGRES_PASSWORD: prism_e2e_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run migrations and seed test data
        working-directory: apps/api
        run: |
          alembic upgrade head
          python -m scripts.seed_e2e_data
        env:
          DATABASE_URL: postgresql+asyncpg://prism_e2e_user:prism_e2e_password@localhost:5432/prism_edu_e2e
          APP_ENV: test

      - name: Start API server
        working-directory: apps/api
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://prism_e2e_user:prism_e2e_password@localhost:5432/prism_edu_e2e
          APP_ENV: test

      - name: Install frontend and Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000

      - name: Upload E2E screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: apps/web/test-results/

  # ── Build and Push Docker Images ─────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [api-integration, web-quality, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest

  # ── Deploy to Staging ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment — configure with actual cloud provider"
        # TODO: Replace with actual deployment command
        # e.g., aws ecs update-service --cluster prism-staging ...

  # ── Deploy to Production ──────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production
        run: echo "Deploy to production environment — configure with actual cloud provider"
        # TODO: Replace with actual deployment command after staging validation
